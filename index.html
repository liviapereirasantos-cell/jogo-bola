<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Hockey Neon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-blue {
            text-shadow: 0 0 10px #38bdf8, 0 0 20px #0284c7;
        }

        .neon-glow-rose {
            text-shadow: 0 0 10px #fb7185, 0 0 20px #e11d48;
        }

        .neon-box-blue {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .neon-box-rose {
            box-shadow: 0 0 15px rgba(251, 113, 133, 0.4), inset 0 0 15px rgba(251, 113, 133, 0.2);
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden">

    <!-- Container Principal do Jogo -->
    <div
        class="relative w-full max-w-md bg-slate-900 border-2 border-cyan-500/40 rounded-2xl p-3 shadow-2xl flex flex-col items-center neon-box-blue">

        <!-- Header / Placar do Jogo -->
        <div
            class="w-full flex justify-between items-center bg-slate-950/80 px-4 py-2.5 rounded-xl border border-slate-800 mb-2">
            <!-- CPU (IA) -->
            <div class="flex items-center space-x-2">
                <div
                    class="w-8 h-8 rounded-full bg-rose-500/20 border border-rose-500 flex items-center justify-center text-rose-400 font-bold text-xs">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 font-orbitron uppercase tracking-wider">CPU</div>
                    <div id="cpuScore"
                        class="text-2xl font-black font-orbitron text-rose-400 neon-glow-rose leading-none">0</div>
                </div>
            </div>

            <!-- Nível / Tempo -->
            <div class="text-center">
                <span id="diffBadge"
                    class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-orbitron text-[10px] px-2 py-0.5 rounded-full uppercase">MÉDIO</span>
                <div class="text-xs text-slate-400 mt-1 font-orbitron">META: 7 GOLS</div>
            </div>

            <!-- Player (Você) -->
            <div class="flex items-center space-x-2 flex-row-reverse space-x-reverse">
                <div
                    class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-500 flex items-center justify-center text-cyan-400 font-bold text-xs">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-slate-400 font-orbitron uppercase tracking-wider">VOCÊ</div>
                    <div id="playerScore"
                        class="text-2xl font-black font-orbitron text-cyan-400 neon-glow-blue leading-none">0</div>
                </div>
            </div>
        </div>

        <!-- Área Principal da Arena / Canvas -->
        <div
            class="relative w-full h-[480px] bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner flex items-center justify-center">

            <canvas id="gameCanvas" class="w-full h-full cursor-none touch-none"></canvas>

            <!-- Interface Overlay (Menus) -->
            <div id="uiOverlay"
                class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-all duration-300 z-20">

                <!-- Menu Inicial -->
                <div id="startScreen" class="w-full flex flex-col items-center space-y-4">
                    <div
                        class="w-16 h-16 bg-cyan-500/20 border-2 border-cyan-400 rounded-2xl flex items-center justify-center mb-1 text-cyan-400 text-3xl shadow-lg neon-box-blue">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h1
                        class="text-3xl font-black font-orbitron tracking-wider bg-gradient-to-r from-cyan-400 via-teal-300 to-rose-400 bg-clip-text text-transparent">
                        CYBER HOCKEY
                    </h1>
                    <p class="text-xs text-slate-400 max-w-xs font-medium">
                        Arraste o rebatedor para marcar gols no adversário. Evite levar gols na sua baliza!
                    </p>

                    <!-- Seleção de Dificuldade -->
                    <div class="w-full max-w-xs pt-2">
                        <label class="text-[11px] font-orbitron text-slate-400 block mb-1">DIFICULDADE DA CPU</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button
                                class="diff-btn py-2 bg-slate-800 border border-slate-700 rounded-lg font-orbitron text-xs text-slate-300 hover:border-cyan-400 active:scale-95 transition-all"
                                data-diff="easy">FÁCIL</button>
                            <button
                                class="diff-btn py-2 bg-cyan-500/20 border-2 border-cyan-400 rounded-lg font-orbitron text-xs text-cyan-400 font-bold active:scale-95 transition-all"
                                data-diff="medium">MÉDIO</button>
                            <button
                                class="diff-btn py-2 bg-slate-800 border border-slate-700 rounded-lg font-orbitron text-xs text-slate-300 hover:border-rose-400 active:scale-95 transition-all"
                                data-diff="hard">HARD</button>
                        </div>
                    </div>

                    <button id="startBtn"
                        class="w-full max-w-xs py-3.5 mt-4 bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold text-base text-white rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 neon-box-blue">
                        <i class="fa-solid fa-play"></i> INICIAR JOGO
                    </button>
                </div>

                <!-- Game Over Screen -->
                <div id="gameOverScreen" class="w-full flex flex-col items-center space-y-4 hidden">
                    <div id="resultIcon"
                        class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-lg"></div>
                    <h2 id="resultTitle" class="text-3xl font-black font-orbitron"></h2>
                    <p id="resultText" class="text-sm text-slate-300"></p>

                    <button id="restartBtn"
                        class="w-full max-w-xs py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold text-base text-white rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> JOGAR NOVAMENTE
                    </button>
                </div>

            </div>
        </div>

        <!-- Controles Inferiores / Barra de Ferramentas -->
        <div class="w-full flex justify-between items-center mt-2 px-1">
            <button id="pauseBtn"
                class="py-2 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-lg text-xs font-orbitron text-slate-300 flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-pause"></i> PAUSAR
            </button>
            <button id="soundBtn"
                class="py-2 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-lg text-xs font-orbitron text-slate-300 flex items-center gap-1.5 transition-all">
                <i id="soundIcon" class="fa-solid fa-volume-high text-cyan-400"></i> SOM
            </button>
        </div>
    </div>

    <script>
        // --- SINTETIZADOR DE ÁUDIO ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playHit() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) { }
            }
            playWall() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch (e) { }
            }
            playGoal(isPlayer) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    const startFreq = isPlayer ? 440 : 220;
                    const endFreq = isPlayer ? 880 : 110;
                    osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.35);
                } catch (e) { }
            }
        }

        const sound = new SoundSystem();

        // Variáveis de Canvas e Referências de UI
        let canvas, ctx;
        let uiOverlay, startScreen, gameOverScreen;
        let cpuScoreEl, playerScoreEl, diffBadge;
        let startBtn, restartBtn, pauseBtn, soundBtn, soundIcon;
        let resultIcon, resultTitle, resultText;

        // Estado do Jogo
        let canvasW = 380;
        let canvasH = 480;
        let gameActive = false;
        let isPaused = false;
        let selectedDifficulty = 'medium'; // easy, medium, hard
        let scorePlayer = 0;
        let scoreCPU = 0;
        const targetScore = 7;

        // Entidades do Jogo
        let puck, playerPaddle, cpuPaddle;
        let particles = [];

        // Redimensionamento Dinâmico do Canvas
        function resizeCanvas() {
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            canvasW = canvas.width;
            canvasH = canvas.height;
        }

        // --- CLASSE DISCO (PUCK) ---
        class Puck {
            constructor() {
                this.radius = 14;
                this.reset();
            }
            reset(scorer = 'player') {
                this.x = canvasW / 2;
                this.y = scorer === 'player' ? canvasH / 2 - 40 : canvasH / 2 + 40;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = scorer === 'player' ? -3 : 3;
                this.friction = 0.992;
                this.maxSpeed = 12;
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;

                // Limite de velocidade máxima
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                // Colisão Lateral (Paredes)
                if (this.x - this.radius < 8) {
                    this.x = 8 + this.radius;
                    this.vx *= -1;
                    sound.playWall();
                    createSpark(this.x, this.y, '#38bdf8');
                } else if (this.x + this.radius > canvasW - 8) {
                    this.x = canvasW - 8 - this.radius;
                    this.vx *= -1;
                    sound.playWall();
                    createSpark(this.x, this.y, '#38bdf8');
                }

                // Gols e Paredes de Fundo (Gol largura de 140px no centro)
                const goalWidth = 140;
                const goalLeft = (canvasW - goalWidth) / 2;
                const goalRight = goalLeft + goalWidth;

                // Parede Superior / Gol CPU
                if (this.y - this.radius < 8) {
                    if (this.x > goalLeft && this.x < goalRight) {
                        // GOL DO JOGADOR!
                        handleGoal('player');
                    } else {
                        this.y = 8 + this.radius;
                        this.vy *= -1;
                        sound.playWall();
                        createSpark(this.x, this.y, '#fb7185');
                    }
                }

                // Parede Inferior / Gol Jogador
                if (this.y + this.radius > canvasH - 8) {
                    if (this.x > goalLeft && this.x < goalRight) {
                        // GOL DA CPU!
                        handleGoal('cpu');
                    } else {
                        this.y = canvasH - 8 - this.radius;
                        this.vy *= -1;
                        sound.playWall();
                        createSpark(this.x, this.y, '#38bdf8');
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- CLASSE REBATEDOR (PADDLE) ---
        class Paddle {
            constructor(isCPU = false) {
                this.isCPU = isCPU;
                this.radius = 26;
                this.x = canvasW / 2;
                this.y = isCPU ? 50 : canvasH - 50;
                this.targetX = this.x;
                this.targetY = this.y;
                this.color = isCPU ? '#fb7185' : '#38bdf8';
            }
            update() {
                if (this.isCPU) {
                    // Lógica da IA da CPU
                    let speed = 0.08;
                    if (selectedDifficulty === 'easy') speed = 0.05;
                    if (selectedDifficulty === 'hard') speed = 0.14;

                    // A CPU ataca o disco quando ele está no seu campo
                    if (puck.y < canvasH / 2 + 50) {
                        this.targetX = puck.x;
                        this.targetY = Math.max(40, puck.y - 20);
                    } else {
                        // Retorna à posição defensiva
                        this.targetX = canvasW / 2;
                        this.targetY = 60;
                    }

                    this.x += (this.targetX - this.x) * speed;
                    this.y += (this.targetY - this.y) * speed;

                    // Restrição da CPU (metade superior)
                    this.y = Math.min(canvasH / 2 - this.radius - 5, Math.max(30, this.y));
                } else {
                    // Restrição do Jogador (metade inferior)
                    this.y = Math.max(canvasH / 2 + this.radius + 5, Math.min(canvasH - 30, this.y));
                }

                this.x = Math.max(this.radius + 10, Math.min(canvasW - this.radius - 10, this.x));

                // Colisão Rebatedor vs Disco
                const dx = puck.x - this.x;
                const dy = puck.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.radius + puck.radius) {
                    sound.playHit();
                    createSpark((this.x + puck.x) / 2, (this.y + puck.y) / 2, this.color, 12);

                    const angle = Math.atan2(dy, dx);
                    const force = 9.5;

                    // Cálculo da velocidade com impulso mínimo para evitar travamento
                    let newVx = Math.cos(angle) * force + (this.x - this.targetX) * 0.1;
                    let newVy = Math.sin(angle) * force + (this.y - this.targetY) * 0.1;

                    // Evita travamento quando as bolinhas ficam grudadas
                    if (Math.abs(newVy) < 2) {
                        newVy = this.isCPU ? 4 : -4;
                    }

                    puck.vx = newVx;
                    puck.vy = newVy;

                    // Reposicionar fora de sobreposição com margem extra de segurança (3px)
                    const overlap = (this.radius + puck.radius) - dist + 3;
                    puck.x += Math.cos(angle) * overlap;
                    puck.y += Math.sin(angle) * overlap;
                }
            }
            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;

                // Anel Externo
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Centro / Pegador
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- SISTEMA DE FAÍSCAS E PARTÍCULAS ---
        class Spark {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createSpark(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push(new Spark(x, y, color));
            }
        }

        // Gols e Atualização de Placar
        function handleGoal(scorer) {
            if (scorer === 'player') {
                scorePlayer++;
                playerScoreEl.textContent = scorePlayer;
                sound.playGoal(true);
                createSpark(canvasW / 2, 20, '#38bdf8', 35);
            } else {
                scoreCPU++;
                cpuScoreEl.textContent = scoreCPU;
                sound.playGoal(false);
                createSpark(canvasW / 2, canvasH - 20, '#fb7185', 35);
            }

            if (scorePlayer >= targetScore || scoreCPU >= targetScore) {
                endGame(scorePlayer >= targetScore);
            } else {
                puck.reset(scorer);
            }
        }

        // Desenhar Elementos de Fundo da Mesa
        function drawCourt() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvasW, canvasH);

            ctx.lineWidth = 2;

            // Linha Central (Rede Neon)
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
            ctx.beginPath();
            ctx.moveTo(8, canvasH / 2);
            ctx.lineTo(canvasW - 8, canvasH / 2);
            ctx.stroke();

            // Círculo Central
            ctx.beginPath();
            ctx.arc(canvasW / 2, canvasH / 2, 45, 0, Math.PI * 2);
            ctx.stroke();

            // Gols Desenhados
            const goalWidth = 140;
            const goalLeft = (canvasW - goalWidth) / 2;

            // Gol CPU (Topo - Rose)
            ctx.strokeStyle = '#fb7185';
            ctx.shadowColor = '#fb7185';
            ctx.shadowBlur = 10;
            ctx.strokeRect(goalLeft, 2, goalWidth, 10);

            // Gol Player (Base - Blue)
            ctx.strokeStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.strokeRect(goalLeft, canvasH - 12, goalWidth, 10);
        }

        // --- LOOP PRINCIPAL DE ANIMAÇÃO ---
        function gameLoop() {
            if (!gameActive || isPaused) return;

            drawCourt();

            // Atualização de entidades
            puck.update();
            playerPaddle.update();
            cpuPaddle.update();

            // Renderização de entidades
            puck.draw();
            playerPaddle.draw();
            cpuPaddle.draw();

            // Atualização e renderização de partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        // --- CONTROLES DE INTERAÇÃO (MOUSE & TOUCH) ---
        function handleMove(e) {
            if (!gameActive || isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            playerPaddle.targetX = clientX - rect.left;
            playerPaddle.targetY = clientY - rect.top;
            playerPaddle.x = playerPaddle.targetX;
            playerPaddle.y = playerPaddle.targetY;
        }

        // --- GERENCIAMENTO DE ESTADOS DO JOGO ---
        function startGame() {
            sound.init();
            scorePlayer = 0;
            scoreCPU = 0;
            playerScoreEl.textContent = '0';
            cpuScoreEl.textContent = '0';

            puck = new Puck();
            playerPaddle = new Paddle(false);
            cpuPaddle = new Paddle(true);
            particles = [];

            uiOverlay.classList.add('hidden');
            gameActive = true;
            isPaused = false;

            requestAnimationFrame(gameLoop);
        }

        function endGame(playerWon) {
            gameActive = false;
            uiOverlay.classList.remove('hidden');
            startScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');

            if (playerWon) {
                resultIcon.className = "w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-lg bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 neon-box-blue";
                resultIcon.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                resultTitle.className = "text-3xl font-black font-orbitron text-emerald-400";
                resultTitle.textContent = "VITÓRIA MAGNÍFICA!";
                resultText.textContent = `Você venceu a CPU por ${scorePlayer} a ${scoreCPU}! Domínio total da mesa.`;
            } else {
                resultIcon.className = "w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-lg bg-rose-500/20 border-2 border-rose-500 text-rose-400 neon-box-rose";
                resultIcon.innerHTML = `<i class="fa-solid fa-skull"></i>`;
                resultTitle.className = "text-3xl font-black font-orbitron text-rose-400";
                resultTitle.textContent = "DERROTA!";
                resultText.textContent = `A CPU venceu por ${scoreCPU} a ${scorePlayer}. Treine mais e tente novamente!`;
            }
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            if (!isPaused) {
                requestAnimationFrame(gameLoop);
                pauseBtn.innerHTML = `<i class="fa-solid fa-pause"></i> PAUSAR`;
            } else {
                pauseBtn.innerHTML = `<i class="fa-solid fa-play"></i> CONTINUAR`;
            }
        }

        // --- INICIAÇÃO SEGRA DO DOM ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            uiOverlay = document.getElementById('uiOverlay');
            startScreen = document.getElementById('startScreen');
            gameOverScreen = document.getElementById('gameOverScreen');
            cpuScoreEl = document.getElementById('cpuScore');
            playerScoreEl = document.getElementById('playerScore');
            diffBadge = document.getElementById('diffBadge');

            startBtn = document.getElementById('startBtn');
            restartBtn = document.getElementById('restartBtn');
            pauseBtn = document.getElementById('pauseBtn');
            soundBtn = document.getElementById('soundBtn');
            soundIcon = document.getElementById('soundIcon');

            resultIcon = document.getElementById('resultIcon');
            resultTitle = document.getElementById('resultTitle');
            resultText = document.getElementById('resultText');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Listeners de Controles Touch / Mouse
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', handleMove, { passive: true });

            // Botões do Menu
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);

            soundBtn.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                soundIcon.className = sound.enabled ? "fa-solid fa-volume-high text-cyan-400" : "fa-solid fa-volume-xmark text-slate-500";
            });

            // Botões de Seleção de Dificuldade
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.diff-btn').forEach(b => {
                        b.className = "diff-btn py-2 bg-slate-800 border border-slate-700 rounded-lg font-orbitron text-xs text-slate-300 hover:border-cyan-400 active:scale-95 transition-all";
                    });
                    const diff = e.target.getAttribute('data-diff');
                    selectedDifficulty = diff;

                    if (diff === 'easy') {
                        e.target.className = "diff-btn py-2 bg-emerald-500/20 border-2 border-emerald-400 rounded-lg font-orbitron text-xs text-emerald-400 font-bold active:scale-95 transition-all";
                        diffBadge.textContent = "FÁCIL";
                        diffBadge.className = "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-orbitron text-[10px] px-2 py-0.5 rounded-full uppercase";
                    } else if (diff === 'medium') {
                        e.target.className = "diff-btn py-2 bg-cyan-500/20 border-2 border-cyan-400 rounded-lg font-orbitron text-xs text-cyan-400 font-bold active:scale-95 transition-all";
                        diffBadge.textContent = "MÉDIO";
                        diffBadge.className = "bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-orbitron text-[10px] px-2 py-0.5 rounded-full uppercase";
                    } else {
                        e.target.className = "diff-btn py-2 bg-rose-500/20 border-2 border-rose-400 rounded-lg font-orbitron text-xs text-rose-400 font-bold active:scale-95 transition-all";
                        diffBadge.textContent = "HARD";
                        diffBadge.className = "bg-rose-500/10 border border-rose-500/30 text-rose-400 font-orbitron text-[10px] px-2 py-0.5 rounded-full uppercase";
                    }
                });
            });
        });
    </script>
</body>

</html>
